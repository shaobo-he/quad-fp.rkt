name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # gcc (with libquadmath + quadmath.h) is preinstalled on the runner.
      - name: Install Racket
        uses: Bogdanp/setup-racket@v1.15
        with:
          version: stable

      - name: Show toolchain
        run: |
          gcc --version | head -1
          racket --version

      # Catalog workflow first: installing as a package pulls the deps and
      # build-deps (typed-racket-lib, rackcheck-lib, math-lib, …), runs the
      # native build hook (private/build-native.rkt), and builds the docs —
      # mirroring what pkgs.racket-lang.org's build server does.
      - name: Install as a package
        run: raco pkg install --auto --name quad-fp

      - name: Test installed package
        run: raco test --collection quad-fp

      # Developer workflow: rebuild libquadf via the Makefile and run the suite
      # directly. Comes after the install so the test deps are available.
      - name: Build and test (make)
        run: make test
