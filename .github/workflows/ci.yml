name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # gcc (with libquadmath + quadmath.h) is preinstalled on the runner.
      - name: Install Racket
        uses: Bogdanp/setup-racket@v1.15
        with:
          version: stable

      - name: Show toolchain
        run: |
          gcc --version | head -1
          racket --version

      # Developer workflow: build libquadf.so via the Makefile, run the suite.
      - name: Build and test (make)
        run: make test

      # Catalog workflow: install as a package — this runs the native build
      # hook (private/build-native.rkt) and builds the docs, mirroring what
      # pkgs.racket-lang.org's build server does — then run the tests.
      - name: Install as a package
        run: raco pkg install --auto --name quad-fp

      - name: Test installed package
        run: raco test --collection quad-fp
